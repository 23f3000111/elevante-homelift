<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Section drawing lab</title>
<style>
  :root{
    --paper:#F2EFE9; --ink:#1A1F1C; --accent:#2F5D45;
    --oak:#C89A62; --oak-dk:#A97B45; --oak-lt:#E0BE93;
    --shaft:rgba(47,93,69,.06);
  }
  *{box-sizing:border-box;margin:0}
  body{background:var(--paper);color:var(--ink);font:16px/1.5 system-ui,sans-serif}
  .pad{height:50vh}
  .stage{position:sticky;top:0;height:100vh;display:grid;place-items:center;padding:20px}
  svg{width:min(1120px,95vw);height:auto;overflow:visible}

  .wall{fill:none;stroke:var(--ink);stroke-width:3;stroke-linejoin:round}
  .slab{fill:var(--ink)}
  .ground{stroke:var(--ink);stroke-width:4}
  .hatch{fill:url(#hatch)}
  .shaftzone{fill:var(--shaft);stroke:var(--accent);stroke-width:1.5;stroke-dasharray:6 6}
  /* treads are filled with the paper colour so they occlude the cabin:
     that is what tells you the cabin is BEHIND the stair */
  .tread{fill:var(--paper);stroke:var(--ink);stroke-width:2.2;stroke-linejoin:round}
  .stringer{fill:var(--paper);stroke:var(--ink);stroke-width:2.4}
  .rail{fill:none;stroke:var(--ink);stroke-width:2.4;stroke-linecap:round}
  .cabin-body{fill:var(--oak);stroke:var(--ink);stroke-width:2.6}
  .cabin-in{fill:var(--oak-lt)}
  .door{fill:var(--oak-dk);stroke:var(--ink);stroke-width:2.2}
  .person{fill:var(--ink)}
  .furn{fill:none;stroke:var(--ink);stroke-width:2;opacity:.3}
  .note{font:600 12.5px/1 ui-monospace,monospace;fill:var(--accent);letter-spacing:.1em;text-transform:uppercase}
  .leader{stroke:var(--accent);stroke-width:1.2;fill:none}
  .dot{fill:var(--accent)}
  .readout{font:700 13px/1 ui-monospace,monospace;fill:var(--accent);letter-spacing:.12em}
</style>
</head>
<body>
<div class="pad"></div>

<section id="scene" style="height:360vh;position:relative">
<div class="stage">
<svg viewBox="0 0 1000 730" role="img" aria-labelledby="t">
  <title id="t">Section through a house. The lift cabin travels vertically inside the staircase footprint, behind the stair flight, between the ground and first floor.</title>
  <defs>
    <pattern id="hatch" width="9" height="9" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="9" stroke="#1A1F1C" stroke-width="1.1" opacity=".3"/>
    </pattern>
    <!-- the cabin is only ever visible inside the stairwell volume -->
    <clipPath id="well"><rect x="566" y="128" width="220" height="534"/></clipPath>
    <clipPath id="openClip"><rect x="560" y="330" width="240" height="30"/></clipPath>
  </defs>

  <!-- ================= shell ================= -->
  <path class="wall" d="M70 660 V70 H930 V660"/>
  <line class="ground" x1="40" y1="660" x2="960" y2="660"/>
  <rect class="hatch" x="40" y="660" width="920" height="24"/>

  <!-- stairwell volume: full travel height, so the cabin never looks unsupported -->
  <rect class="shaftzone" id="zone" x="566" y="128" width="220" height="532" rx="2"/>

  <!-- first floor slab, split by the stairwell opening -->
  <rect class="slab" x="70" y="336" width="490" height="20"/>
  <rect class="slab" x="800" y="336" width="130" height="20"/>

  <!-- upper window + lower door, so it reads as a house -->
  <g class="furn">
    <rect x="140" y="150" width="120" height="110"/><line x1="200" y1="150" x2="200" y2="260"/>
    <rect x="140" y="470" width="86" height="190"/>
    <path d="M330 660 v-58 h150 v58"/><path d="M330 614 h150"/>
    <rect x="852" y="228" width="60" height="108"/>
  </g>

  <!-- ================= cabin (BEHIND the stair) ================= -->
  <g clip-path="url(#well)">
    <g id="cabin">
      <rect class="cabin-body" x="596" y="452" width="164" height="206" rx="3"/>
      <rect class="cabin-in" x="608" y="464" width="140" height="150" rx="2"/>
      <rect x="738" y="492" width="11" height="34" rx="3" fill="#1A1F1C" opacity=".65"/>
      <g class="person">
        <circle cx="654" cy="500" r="12"/>
        <path d="M642 517 q12 -6 24 0 l-3 48 h-18 z"/>
        <rect x="645" y="565" width="7" height="44" rx="3"/>
        <rect x="656" y="565" width="7" height="44" rx="3"/>
      </g>
    </g>
  </g>

  <!-- ================= upper opening door ================= -->
  <g clip-path="url(#openClip)">
    <rect class="door" id="upperDoor" x="560" y="336" width="240" height="20"/>
  </g>

  <!-- lower opening panel, behind the stair -->
  <rect class="door" id="lowerDoor" x="566" y="640" width="220" height="20" opacity="0"/>

  <!-- ================= the staircase, IN FRONT ================= -->
  <g id="stair">
    <path class="stringer" d="M566 660 L786 356 L786 384 L588 660 Z"/>
    <g class="tread">
      <rect x="566" y="636" width="26" height="24"/>
      <rect x="584" y="611" width="26" height="24"/>
      <rect x="602" y="586" width="26" height="24"/>
      <rect x="620" y="561" width="26" height="24"/>
      <rect x="638" y="536" width="26" height="24"/>
      <rect x="656" y="511" width="26" height="24"/>
      <rect x="674" y="486" width="26" height="24"/>
      <rect x="692" y="461" width="26" height="24"/>
      <rect x="710" y="436" width="26" height="24"/>
      <rect x="728" y="411" width="26" height="24"/>
      <rect x="746" y="386" width="26" height="24"/>
      <rect x="764" y="361" width="26" height="24"/>
    </g>
    <path class="rail" d="M572 590 L792 292"/>
    <path class="rail" d="M572 590 V648 M792 292 V350"/>
  </g>

  <!-- ================= annotations ================= -->
  <g id="nVoid" opacity="0">
    <path class="leader" d="M300 520 H560"/><circle class="dot" cx="560" cy="520" r="3"/>
    <text class="note" x="112" y="516">Inside the staircase footprint</text>
  </g>
  <g id="nDoor" opacity="0">
    <path class="leader" d="M880 300 H812 V332"/><circle class="dot" cx="812" cy="332" r="3"/>
    <text class="note" x="836" y="292">Opening closed</text>
  </g>
  <g id="nStair" opacity="0">
    <path class="leader" d="M300 640 H600"/><circle class="dot" cx="600" cy="640" r="3"/>
    <text class="note" x="160" y="636">Stairs stay in use</text>
  </g>
  <text class="readout" id="readout" x="70" y="712">GROUND FLOOR</text>
</svg>
</div>
</section>

<div class="pad" style="height:100vh"></div>

<script src="../site-a-atelier/js/lib/gsap.min.js"></script>
<script src="../site-a-atelier/js/lib/ScrollTrigger.min.js"></script>
<script>
gsap.registerPlugin(ScrollTrigger);
const readout = document.getElementById('readout');
const TRAVEL = -322;   // ground (bottom 658) to first floor (bottom 336)

const tl = gsap.timeline({ scrollTrigger:{ trigger:'#scene', start:'top top', end:'bottom bottom', scrub:0.4 }});
tl.to('#nStair', {opacity:1, duration:.4}, 0)
  .to('#nVoid',  {opacity:1, duration:.4}, 0.5)
  .to('#nStair', {opacity:0, duration:.3}, 1.3)
  .to('#upperDoor', {x:-238, duration:1, ease:'power2.inOut'}, 1.2)
  .to('#nDoor',  {opacity:0, duration:.25}, 1.2)
  .to('#cabin',  {y:TRAVEL, duration:2.6, ease:'power1.inOut'}, 1.7)
  .to('#lowerDoor',{opacity:1, duration:.3}, 2.4)
  .to('#nVoid',  {opacity:0, duration:.3}, 2.2)
  .to('#upperDoor',{x:0, duration:.9, ease:'power2.inOut'}, 4.5)
  .to('#nDoor',  {opacity:1, duration:.35}, 4.8);

ScrollTrigger.create({trigger:'#scene', start:'top top', end:'bottom bottom', scrub:true,
  onUpdate:s=>{ readout.textContent = s.progress<.32 ? 'GROUND FLOOR' : s.progress<.78 ? 'TRAVELLING' : 'FIRST FLOOR'; }});
</script>
</body>
</html>
